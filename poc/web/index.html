<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloudIDE</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --line: #e5e4e0; --text: #23252b; --dim: #74747c;
  --accent: #3b5bdb; --ok: #2f8f5b; --bad: #c4443c; --warn: #b4690e; --bubble: #eef1fc;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; height: 100vh; overflow: hidden;
}

aside { width: 260px; border-right: 1px solid var(--line); background: #fbfbf9;
        display: flex; flex-direction: column; flex-shrink: 0; }
aside h1 { margin: 0; padding: 1rem 1rem .25rem; font-size: 1.05rem; }
aside .sub { padding: 0 1rem .75rem; color: var(--dim); font-size: .78rem; }
aside .list { flex: 1; overflow-y: auto; padding: 0 .6rem 1rem; }
.newbtn { margin: 0 1rem .75rem; padding: .5rem; border: 1px solid var(--line);
          border-radius: 8px; background: #fff; cursor: pointer; font: inherit; font-size: .85rem; }
.item { padding: .5rem .6rem; border-radius: 8px; cursor: pointer; margin-bottom: .2rem; font-size: .84rem; }
.item:hover { background: #f2f1ed; }
.item.active { background: #eaeaf6; }
.item .meta { color: var(--dim); font-size: .74rem; display: flex; gap: .4rem; margin-top: .15rem; }
.badge { padding: 0 .3rem; border-radius: 4px; font-size: .7rem; }
.badge.running { background: #eef1fc; color: var(--accent); }
.badge.idle { background: #e9f4ee; color: var(--ok); }
.badge.failed { background: #fbeceb; color: var(--bad); }
@media (max-width: 820px) { aside { width: 180px; } aside .sub { display: none; } }
@media (max-width: 560px) { aside { width: 150px; } aside h1 { font-size: .95rem; } }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { padding: .6rem 1.25rem; border-bottom: 1px solid var(--line); background: var(--panel);
          display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; min-height: 3rem; }
.topbar .title { font-size: .9rem; font-weight: 500; margin-right: auto;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar a { padding: .3rem .7rem; border: 1px solid var(--line); border-radius: 7px;
            text-decoration: none; color: var(--text); font-size: .8rem; background: #fcfcfb; }
.topbar a.go { background: var(--accent); color: #fff; border-color: var(--accent); }
#feed { flex: 1; overflow-y: auto; padding: 1.25rem; }
.inner { max-width: 820px; margin: 0 auto; }

.welcome h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
.welcome p { color: var(--dim); font-size: .88rem; margin: 0 0 1rem; }
.examples { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.examples button { padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 999px;
                   background: #fff; color: var(--dim); font-size: .8rem; cursor: pointer; }

.user { background: var(--bubble); padding: .6rem .8rem; border-radius: 10px;
        margin: 1.4rem 0 .8rem auto; max-width: 80%; width: fit-content; font-size: .9rem; }
.stage { margin: 1rem 0 .4rem; font-weight: 500; font-size: .86rem; color: var(--dim); }
.stage::before { content: "— "; }
.say { margin: .4rem 0; font-size: .9rem; white-space: pre-wrap; }
.cmd { font-family: var(--mono); font-size: .8rem; color: #6741b8; margin: .3rem 0; white-space: pre-wrap; }
.cmd::before { content: "$ "; }
.out { font-family: var(--mono); font-size: .78rem; color: var(--dim); margin: .2rem 0 .4rem;
       white-space: pre-wrap; max-height: 10rem; overflow-y: auto; }
.info { font-size: .8rem; color: var(--dim); margin: .2rem 0; }
.warn { font-size: .85rem; color: var(--warn); margin: .4rem 0; }
.check { font-size: .85rem; margin: .15rem 0; }
.check.ok { color: var(--ok); }
.check.bad { color: var(--bad); }

details.fold { margin: .25rem 0; font-size: .82rem; }
details.fold > summary { cursor: pointer; color: var(--dim); list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸ "; color: #b7b6b0; }
details.fold[open] > summary::before { content: "▾ "; }
details.fold > summary.write { color: var(--ok); }
details.fold > summary em { font-style: italic; color: #9a9a9f; }
details.fold > pre { margin: .3rem 0 .5rem 1rem; padding: .6rem; background: #f3f2ee;
                     border-radius: 7px; overflow: auto; max-height: 20rem;
                     font-size: .76rem; font-family: var(--mono); white-space: pre-wrap; }
.result { margin: .7rem 0; padding: .7rem .9rem; border: 1px solid var(--line);
          border-radius: 9px; background: var(--panel); font-size: .85rem; }
.result a { color: var(--accent); }

.composer { border-top: 1px solid var(--line); background: var(--panel); padding: .75rem 1.25rem 1rem; }
.composer .inner { display: flex; gap: .6rem; align-items: flex-end; }
.composer textarea {
  flex: 1; min-height: 44px; max-height: 160px; padding: .6rem .75rem; resize: none;
  border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: .9rem; background: #fcfcfb;
}
.composer select { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .4rem;
                   font: inherit; font-size: .82rem; background: #fcfcfb; }
.composer button { padding: .6rem 1.1rem; border: 0; border-radius: 10px; background: var(--accent);
                   color: #fff; font: inherit; font-size: .88rem; cursor: pointer; }
.composer button:disabled { background: #a9b3d9; cursor: not-allowed; }
.hint { max-width: 820px; margin: .4rem auto 0; color: var(--dim); font-size: .75rem; }
</style>
</head>
<body>

<aside>
  <h1>cloudIDE</h1>
  <div class="sub">说一句话，它在容器里写代码、跑测试、部署上线</div>
  <button class="newbtn" id="new">＋ 新建项目</button>
  <div class="list" id="list"></div>
</aside>

<main>
  <div class="topbar" id="topbar"><div class="title">新建项目</div></div>
  <div id="feed"><div class="inner" id="inner"></div></div>
  <div class="composer">
    <div class="inner">
      <select id="tpl"></select>
      <textarea id="input" rows="1" placeholder="帮我做一个简单的个人博客，首页列出文章，有一个关于我的页面"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint" id="hint">第一句话决定做什么，之后可以继续说「换成卡片风格」「加一个联系页」来迭代。</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
// rendered 是「我已经显示到服务端第几条事件」，重连时带上它，服务端只推后面的
let current = null, es = null, rendered = 0, lastNode = null, lastKind = "", retry = null;

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const statusText = (s) => ({ running: "进行中", idle: "已上线", failed: "失败" }[s] || s);
const tail = (s) => {
  const flat = s.replace(/\s+/g, " ").trim();
  return flat.length > 60 ? "…" + flat.slice(-60) : flat;
};

async function api(path, options) {
  const resp = await fetch(path, options);
  if (!resp.ok) throw new Error((await resp.text()).slice(0, 200));
  return resp.json();
}

async function loadTemplates() {
  const list = await api("/api/templates");
  $("tpl").innerHTML = list.map(t => `<option value="${t.key}">${t.label}</option>`).join("");
}

async function loadList() {
  const items = await api("/api/projects");
  $("list").innerHTML = items.map(p => `
    <div class="item ${p.id === current ? "active" : ""}" data-id="${p.id}">
      <div>${esc(p.title)}</div>
      <div class="meta">
        <span class="badge ${p.status}">${statusText(p.status)}</span>
        <span>${p.rounds} 轮</span><span>$${p.usd.toFixed(4)}</span>
      </div>
    </div>`).join("") || '<div class="info" style="padding:.5rem">还没有项目</div>';
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => openProject(el.dataset.id));
}

const feedAtBottom = () => {
  const f = $("feed");
  return f.scrollHeight - f.scrollTop - f.clientHeight < 140;
};
const scrollDown = () => { $("feed").scrollTop = $("feed").scrollHeight; };

function fold(cls, summaryHtml, text) {
  const box = $("inner");
  box.insertAdjacentHTML("beforeend",
    `<details class="fold"><summary class="${cls}">${summaryHtml}</summary><pre></pre></details>`);
  const node = box.lastElementChild;
  node.querySelector("pre").textContent = text;
  return node;
}

function render(ev) {
  const stick = feedAtBottom();
  const box = $("inner");

  if (ev.kind === "thinking") {
    // 思考量很大，一轮折成一块，标题上只滚动显示最新一句
    if (lastKind === "thinking" && lastNode) {
      const pre = lastNode.querySelector("pre");
      pre.textContent += ev.text;
      lastNode.querySelector(".peek").textContent = tail(pre.textContent);
    } else {
      lastNode = fold("", '思考 <em class="peek"></em>', ev.text);
      lastNode.querySelector(".peek").textContent = tail(ev.text);
      lastKind = "thinking";
    }
  } else if (ev.kind === "read") {
    // 连续的读取合并成一行，别占篇幅
    if (lastKind === "read" && lastNode) {
      const n = Number(lastNode.dataset.n) + 1;
      lastNode.dataset.n = n;
      lastNode.querySelector(".label").textContent = `读取 ${n} 个文件`;
      lastNode.querySelector("pre").textContent += "\n" + ev.text;
    } else {
      lastNode = fold("", `<span class="label">读取 ${esc(ev.text)}</span>`, ev.text);
      lastNode.dataset.n = "1";
      lastKind = "read";
    }
  } else if (ev.kind === "say" || ev.kind === "out") {
    if (lastKind === ev.kind && lastNode) {
      lastNode.textContent += ev.text;
    } else {
      box.insertAdjacentHTML("beforeend", `<div class="${ev.kind}"></div>`);
      lastNode = box.lastElementChild;
      lastNode.textContent = ev.text;
      lastKind = ev.kind;
    }
  } else {
    let html;
    if (ev.kind === "user") html = `<div class="user">${esc(ev.text)}</div>`;
    else if (ev.kind === "check")
      html = `<div class="check ${ev.ok ? "ok" : "bad"}">${ev.ok ? "✓" : "✗"} ${esc(ev.text)}</div>`;
    else if (ev.kind === "code")
      html = `<details class="fold"><summary>生成的验收测试</summary><pre>${esc(ev.text)}</pre></details>`;
    else if (ev.kind === "file")
      html = `<details class="fold"><summary class="write">写入 ${esc(ev.text)}</summary><pre>${esc(ev.content || "")}</pre></details>`;
    else if (ev.kind === "result")
      html = `<div class="result">${esc(ev.text)}` +
             (ev.site_url ? `　<a href="${ev.site_url}" target="_blank">打开站点 ↗</a>` : "") +
             (ev.usd != null ? `　累计花费 $${Number(ev.usd).toFixed(4)}` : "") + `</div>`;
    else html = `<div class="${ev.kind}">${esc(ev.text)}</div>`;
    box.insertAdjacentHTML("beforeend", html);
    lastNode = null;
    lastKind = "";
  }
  if (stick) scrollDown();
}

function setTopbar(p) {
  const links = [];
  if (p.site_url) links.push(`<a class="go" href="${p.site_url}" target="_blank">打开站点 ↗</a>`);
  if (p.repo_url) links.push(`<a href="${p.repo_url}" target="_blank">代码</a>`);
  if (p.ci_url) links.push(`<a href="${p.ci_url}" target="_blank">CI</a>`);
  $("topbar").innerHTML = `<div class="title">${esc(p.title || "新建项目")}</div>` + links.join("");
}

function setRunning(running) {
  $("send").disabled = running;
  $("send").textContent = running ? "进行中…" : "发送";
  $("input").disabled = running;
  $("tpl").style.display = current ? "none" : "";
  $("hint").textContent = current
    ? "继续说你想改什么，它会在同一个项目上改完重新测试、重新部署。"
    : "第一句话决定做什么，之后可以继续说「换成卡片风格」「加一个联系页」来迭代。";
}

function follow(id) {
  if (es) { es.close(); es = null; }
  clearTimeout(retry);
  es = new EventSource(`/api/projects/${id}/events?after=${rendered}`);
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.kind === "end") {
      es.close(); es = null;
      setTopbar(ev); setRunning(false); loadList();
      return;
    }
    rendered += 1;
    render(ev);
  };
  es.onerror = () => {
    if (es) { es.close(); es = null; }
    // 连接断了任务多半还在跑，两秒后接着从 rendered 往后收，别让界面看着像卡死
    retry = setTimeout(async () => {
      if (current !== id) return;
      try {
        const p = await api(`/api/projects/${id}?limit=1`);
        if (p.status === "running") follow(id);
        else { setTopbar(p); setRunning(false); loadList(); }
      } catch (err) {
        render({ kind: "warn", text: "连接断了：" + err.message });
        setRunning(false);
      }
    }, 2000);
  };
}

async function openProject(id) {
  current = id;
  if (es) { es.close(); es = null; }
  clearTimeout(retry);
  const p = await api(`/api/projects/${id}`);
  $("inner").innerHTML = p.truncated
    ? '<div class="info">（过程太长，只显示最近的部分）</div>' : "";
  lastNode = null; lastKind = "";
  p.events.forEach(render);
  rendered = p.total_events;
  setTopbar(p);
  setRunning(p.status === "running");
  if (p.status === "running") follow(id);
  loadList();
  scrollDown();
}

function showWelcome() {
  current = null; rendered = 0;
  if (es) { es.close(); es = null; }
  clearTimeout(retry);
  setTopbar({});
  $("inner").innerHTML = `<div class="welcome">
    <h2>说一句话，做一个能打开的网站</h2>
    <p>大模型在断网的容器里写代码、跑验收测试，CI 构建部署，完事给你一个能直接访问的地址。做完还能继续提要求接着改。</p>
    <div class="examples">
      <button data-fill="帮我做一个简单的个人博客，首页按时间列出文章，每篇文章有独立页面，另外有一个关于我的页面">个人博客</button>
      <button data-fill="做一个咖啡店的单页官网，包含店铺介绍、菜单价格、营业时间和联系方式">店铺官网</button>
      <button data-fill="做一个读书笔记站点，首页按书名分类列出笔记，每条笔记有独立页面和评分">读书笔记</button>
    </div></div>`;
  $("inner").querySelectorAll(".examples button").forEach(b =>
    b.onclick = () => { $("input").value = b.dataset.fill; $("input").focus(); });
  lastNode = null; lastKind = "";
  setRunning(false);
  loadList();
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("input").style.height = "auto";
  setRunning(true);
  try {
    if (current) {
      await api(`/api/projects/${current}/messages`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      follow(current);
    } else {
      const p = await api("/api/projects", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ requirement: text, template: $("tpl").value }),
      });
      current = p.id;
      rendered = 0;
      $("inner").innerHTML = "";
      lastNode = null; lastKind = "";
      setTopbar(p);
      setRunning(true);
      follow(p.id);
    }
    loadList();
  } catch (err) {
    render({ kind: "warn", text: "出错：" + err.message });
    setRunning(false);
  }
}

$("send").onclick = send;
$("new").onclick = showWelcome;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
});

loadTemplates().then(showWelcome);
setInterval(() => { if (!es) loadList(); }, 8000);
</script>
</body>
</html>
