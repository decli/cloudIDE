name: ci

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: local
    container:
      image: cloudide-sandbox-py:latest
      # 站点目录是个共享卷，nginx 容器挂的是同一个卷，部署完立刻能访问
      volumes:
        - cloudide_sites:/sites
    env:
      GITEA_INTERNAL_URL: http://gitea:3000
    steps:
      - name: 检出代码
        run: |
          git clone --quiet --depth 1 "${GITEA_INTERNAL_URL}/${GITHUB_REPOSITORY}.git" _src
          cp -a _src/. .
          rm -rf _src
      - name: 静态检查
        run: ./run.sh lint
      - name: 单元测试
        run: ./run.sh test
      - name: 验收测试
        run: ./run.sh acceptance
      - name: 构建
        run: ./run.sh build
      - name: 部署
        run: |
          NAME="${GITHUB_REPOSITORY##*/}"
          rm -rf "/sites/$NAME"
          mkdir -p "/sites/$NAME"
          cp -a dist/. "/sites/$NAME/"
          echo "已部署到 /sites/$NAME"
