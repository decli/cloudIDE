# 每个项目一个子域名，站点跑在各自的根目录下。
# 这样线上路径和验收测试里的本地服务器完全一致，站点里的绝对路径不会失效。
server {
    listen 80;
    server_name ~^(?<proj>[a-z0-9][a-z0-9-]*)\.localhost$;
    root /usr/share/nginx/html/$proj;
    charset utf-8;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# 裸 localhost 用来看有哪些项目
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
