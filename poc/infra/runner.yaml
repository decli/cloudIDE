log:
  level: info

runner:
  capacity: 1
  timeout: 15m
  # 只提供一个标签 local，直接复用本地构建好的沙箱镜像，避免 CI 再去拉镜像
  labels:
    - "local:docker://cloudide-sandbox-py:latest"

cache:
  enabled: false

container:
  # 挂到 compose 的网络上，任务容器才能用 http://gitea:3000 访问 Gitea
  network: cloudide_default
  privileged: false
  force_pull: false
  valid_volumes: []
