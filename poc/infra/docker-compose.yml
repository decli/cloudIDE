name: cloudide

services:
  # Web 界面 + 编排服务
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: cloudide-web:latest
    container_name: cloudide-web
    depends_on:
      - gitea
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      MAX_USD: ${MAX_USD:-0.50}
      # 服务之间走容器网络，给用户看的链接走 localhost
      GITEA_URL: http://gitea:3000
      GITEA_PUBLIC_URL: http://localhost:3000
      GITEA_USER: ${GITEA_USER:-cloudide}
      GITEA_TOKEN: ${GITEA_TOKEN}
      PAGES_URL: http://localhost:8081
      # 起沙箱容器时要用宿主机上的真实路径
      WORKSPACES_HOST_DIR: ${WORKSPACES_HOST_DIR}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../workspaces:/app/workspaces
    restart: unless-stopped

  # 部署好的站点由它对外提供访问
  pages:
    image: nginx:alpine
    container_name: cloudide-pages
    ports:
      - "8081:80"
    volumes:
      - sites:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1
    container_name: cloudide-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DOMAIN: localhost
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    ports:
      - "3000:3000"
    volumes:
      - ./gitea-data:/data
    restart: unless-stopped

  runner:
    image: gitea/act_runner:latest
    container_name: cloudide-runner
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: local-runner
      CONFIG_FILE: /config/runner.yaml
    volumes:
      # runner 用宿主机的 Docker 起任务容器，这样能直接复用本地镜像
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-data:/data
      - ./runner.yaml:/config/runner.yaml:ro
    restart: unless-stopped

volumes:
  # CI 把构建产物写进来，nginx 从这里读，两边挂的是同一个卷
  sites:
